<style>

@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1426;--card:#19213a;--tx:#e8ecf8;--bd:#2c3657;--navy:#9db4ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,sans-serif;line-height:1.8;padding-bottom:70px}
header{background:#14295c;color:#fff;padding:22px 16px;text-align:center;border-bottom:4px solid var(--gold)}
header h1{margin:0;font-size:24px}header p{margin:4px 0 0;color:#f3d77a}
main{max-width:760px;margin:auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin:12px 0}
.bar{height:12px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--pink));transition:.4s}
.stats{display:flex;gap:8px;margin-top:10px}.stats div{flex:1;text-align:center;background:var(--bg);border-radius:12px;padding:6px;font-size:13px}.stats b{display:block;font-size:18px;color:var(--navy)}
h2,h3{color:var(--navy);margin:4px 0}
button{font-family:inherit;cursor:pointer;border:0;border-radius:12px;padding:9px 14px;font-size:15px;font-weight:700;background:var(--navy);color:#fff}
button.g{background:var(--gold);color:#222}button.l{background:var(--bg);color:var(--navy);border:1px solid var(--bd)}
.chip{display:inline-block;margin:3px;padding:6px 12px;border-radius:20px;background:var(--bg);border:1px solid var(--bd);color:var(--navy)}.chip.d{background:#fff3c4;border-color:var(--gold);color:#5a4500}
.opt{display:block;width:100%;text-align:right;margin:6px 0;background:var(--bg);color:var(--tx);border:2px solid var(--bd)}.opt.ok{border-color:#1f9d55;background:#e3f6ea;color:#14532d}.opt.no{border-color:#d33;background:#fde8e8;color:#7f1d1d}
.step{background:var(--bg);border-right:5px solid var(--navy);border-radius:10px;padding:8px 12px;margin:8px 0}
.ans{background:#fff6d6;border:2px solid var(--gold);border-radius:12px;padding:10px;color:#4a3a00;margin:8px 0;font-weight:700}

.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px;direction:ltr}.fr i,.fr b{font-style:normal;font-weight:400;padding:0 3px}.fr i{border-bottom:1.5px solid currentColor}
.m{direction:ltr;unicode-bidi:isolate;display:inline-block;font-family:"Times New Roman",serif;font-size:1.15em}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--bg);border-top:2px solid var(--gold);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}nav button{flex:1;margin:0 3px;background:var(--card);color:var(--navy)}nav button.on{background:var(--navy);color:#fff}

<script>
const F=(a,b)=>`<span class=fr><i>${a}</i><b>${b}</b></span>`,M=s=>`<span class=m>${s}</span>`;
const T=["قوانين الأسس والمعادلات الأسية","الدالة التربيعية ورسمها","التمدد","التشابه","حساب المثلثات","المستقيم ومعادلته","الإحصاء","الدوال الكسرية والمجال"];
const Q=[
{t:0,n:"م1 س1",q:`ما ناتج ${F("(x³)⁵","(x⁸)²")} في أبسط صورة؟`,o:["1/x","x","x⁻²","x³¹"],a:0,h:"ابدأي برفع القوة لقوة: اضربي الأسس، وبعدها اقسمي.",
s:[`نضرب الأسس عند رفع القوة لقوة: ${M("(x³)⁵ = x¹⁵ ، (x⁸)² = x¹⁶")}`,`نقسم القوى المتساوية الأساس بطرح الأسس: ${M(F("x¹⁵","x¹⁶")+" = x<sup>15−16</sup> = x⁻¹ = "+F(1,"x"))}`],f:`(أ) ${M(F(1,"x"))}`,y:"الأساس واحد (x) فنوحّد الأسس الأول: الضرب في القوة لقوة، ثم الطرح في القسمة. الناتج سالب يعني مقلوب.",m:"الخلط بين جمع الأسس (في الضرب) وضربها (في القوة لقوة)."},
{t:0,n:"م1 س5",q:`إذا كان: ${M("2 = 3<sup>y</sup>")} فما قيمة ${M("9<sup>y</sup>")}؟`,o:["2","4","18","81"],a:1,h:"اكتبي 9 على صورة قوة للعدد 3 (9 = 3²).",
s:[`نكتب 9 على صورة قوة للعدد 3: ${M("9<sup>y</sup> = (3²)<sup>y</sup> = (3<sup>y</sup>)²")}`,`نعوض ${M("3<sup>y</sup> = 2")}: ${M("2² = 4")}`],f:`(ب) ${M("9<sup>y</sup> = 4")}`,y:"المعطى عن 3^y، فنحوّل المطلوب لنفس الأساس 3 لنقدر نعوّض.",m:"ضرب 2 × 9 أو اعتبار 9^y = 2 × 9."},
{t:0,n:"م2 س1",q:`أوجد مجموعة الحل في ℝ للمعادلة: ${M("5<sup>2x−1</sup> = 125")}`,s:[`نكتب 125 على صورة قوة للأساس 5: ${M("125 = 5³")}`,`نساوي الأسس لتساوي الأساسات: ${M("2x − 1 = 3")}`,`نحل المعادلة: ${M("2x = 4 ، x = 2")}`],f:`مجموعة الحل = {2}`,y:"لو الأساسات متساوية والقوى متساوية، يبقى الأسس متساوية. عشان كده وحّدنا الأساس أولًا.",m:"مساواة الأسس قبل توحيد الأساسات."},
{t:1,n:"م1 س2",q:`إذا كانت (h, k) هي رأس منحنى الدالة f حيث ${M("f(x) = 2x² − 8x + 7")}، فما قيمة h؟`,o:["2","4","6","8"],a:0,h:"استخدمي قانون الإحداثي السيني للرأس.",
s:[`إحداثي الرأس السيني: ${M("h = "+F("−b","2a"))}`,`من الدالة: ${M("a = 2 , b = −8")}`,`نعوض: ${M("h = "+F("−(−8)","2×2")+" = "+F(8,4)+" = 2")}`],f:`(أ) h = 2`,y:"الرأس عند محور التماثل، وقانونه يعتمد على معاملي x² و x فقط.",m:"نسيان إشارة b السالبة فتطلع −2 بدل 2."},
{t:1,n:"م1 س6",q:`أي من الدوال الآتية مجموعة أصفارها {−2, 0}؟`,o:["f(x) = x² − 4","f(x) = x³ + 8","f(x) = x² − 2x","f(x) = x² + 2x"],a:3,h:"الأصفار هي حلول f(x) = 0. جربي التحليل.",
s:[`ندرس كل دالة بوضع ${M("f(x) = 0")}`,`الدالة (د): ${M("x² + 2x = 0")}`,`نحلل بإخراج عامل مشترك: ${M("x(x + 2) = 0")}`,`إذن ${M("x = 0")} أو ${M("x = −2")} وهي الأصفار المطلوبة.`],f:`(د) ${M("f(x) = x² + 2x")}`,y:"الصفر هو القيمة اللي تخلي الدالة بـ 0، والتحليل يحوّل المعادلة لحاصل ضرب يساوي صفر.",m:"أن (أ) أصفارها ±2 وليس 0 و −2."},
{t:1,n:"م2 س8",q:`مثّل بيانيًا الدالة f حيث ${M("f(x) = (x+3)² − 1")} وأوجد القيمة العظمى أو الصغرى للدالة.`,s:[`نكمل جدول القيم بالتعويض، مثلًا: ${M("f(−6) = (−3)² − 1 = 8")}`,`الجدول: x = −6,−5,−4,−3,−2,−1,0 ← y = 8,3,0,−1,0,3,8`,`ننقل النقاط إلى المستوى ونصلها بمنحنى ناعم (قطع مكافئ).`,`الرأس: ${M("(−3 , −1)")} ومعامل x² موجب (+1) فالمنحنى مفتوح لأعلى ومحور التماثل ${M("x = −3")}`],f:`القيمة الصغرى للدالة = −1 (عند x = −3) ولا توجد قيمة عظمى`,y:"المنحنى المفتوح لأعلى له أدنى نقطة (الرأس) فهي القيمة الصغرى، ولا يوجد أعلى.",m:"قراءة الرأس (3, −1) بدل (−3, −1): الصيغة (x+3) تعني الإزاحة لليسار."},
{t:2,n:"م1 س3",q:`ما النسبة التي تعبر عن معامل التمدد الذي مركزه نقطة الأصل O ويحول النقطة A(6, −2) إلى النقطة B(3, −1)؟`,o:["2","3","1/3","1/2"],a:3,h:"معامل التمدد = الصورة ÷ الأصل (وليس العكس).",
s:[`معامل التمدد = ${F("إحداثي الصورة","إحداثي الأصل")}`,`نأخذ الإحداثي السيني: ${M("k = "+F(3,6)+" = "+F(1,2))}`,`نتحقق بالإحداثي الصادي: ${M(F("−1","−2")+" = "+F(1,2)+" ✓")}`],f:`(د) ${M(F(1,2))}`,y:"كل إحداثي يُضرب في k نفسه، فلو القيمتان أعطتا نفس النسبة نتأكد إن الحل صح.",m:"قسمة الأصل على الصورة فتطلع 2."},
{t:3,n:"م1 س4",q:`إذا كان △DEF ~ △ABC (DE=5، DF=3، EF=4، والضلع AC=6) فما محيط المثلث ABC؟`,o:["12","18","24","48"],a:2,h:"نسبة المحيطين = نسبة التشابه.",
s:[`المثلث DEF أضلاعه 3، 4، 5 فمحيطه ${M("3+4+5 = 12")} سم`,`الضلع AC ينظر DF، فنسبة التشابه: ${M(F(6,3)+" = 2")}`,`نسبة المحيطين = نسبة التشابه، إذن محيط ABC = ${M("12 × 2 = 24")} سم`],f:`(ج) 24 سم`,y:"في التشابه كل الأطوال المتناظرة بنفس النسبة، والمحيط مجموع أطوال.",m:"تطبيق النسبة على المساحة، أو مقارنة أضلاع غير متناظرة."},
{t:3,n:"م2 س7",q:`AB ∥ DC ، AC ∩ BD = {E}. أثبت أن △ABE ~ △CDE وباستخدام الأطوال (AB=6، AE=7.5، CD=4) أوجد طول EC.`,s:[`الإثبات في المثلثين ABE، CDE:`,`${M("m(∠ABE) = m(∠CDE)")} بالتبادل، لأن AB ∥ DC والقاطع BD.`,`وكذلك ${M("m(∠AEB) = m(∠CED)")} (بالتقابل بالرأس).`,`إذن △ABE ~ △CDE (تشابه بزاويتين).`,`من التشابه تتناسب الأضلاع المتناظرة: ${M(F("AB","CD")+" = "+F("AE","CE")+" ⟹ "+F(6,4)+" = "+F("7.5","EC"))}`,`ومنها: ${M("EC = "+F("7.5×4",6)+" = 5")}`],f:`طول EC = 5 سم`,y:"التشابه بزاويتين يكفي، وبعده نكتب التناسب بشرط ترتيب الرؤوس المتناظرة.",m:"مقابلة A مع D بدل C: لازم نراعي ترتيب التشابه."},
{t:4,n:"م1 س7",q:`إذا كانت ${M("sinθ = "+F(1,2)+" ، cosθ = "+F("√3",2))} فما قيمة tanθ؟`,o:["1","√3/2","1/√3","2/√3"],a:2,h:"tanθ = sinθ ÷ cosθ.",
s:[`ظل الزاوية = جيبها ÷ جيب تمامها: ${M("tanθ = "+F("sinθ","cosθ"))}`,`نعوض: ${M(F(F(1,2),F("√3",2))+" = "+F(1,2)+" × "+F(2,"√3")+" = "+F(1,"√3"))}`],f:`(ج) ${M(F(1,"√3"))}`,y:"القسمة على كسر = الضرب في مقلوبه، فنص يضرب 2/√3 وتتبسط.",m:"قسمة الكسور بدون قلب المقسوم عليه."},
{t:4,n:"م2 س5",q:`في المثلث القائم: الوتر = 20√3 سم، والزاوية 60° والضلع المقابل لها x... (انظري الشكل ص9). أوجد قيمة x.`,s:[`الزاوية 60° والضلع المقابل لها ${M("20√3")} سم، والوتر x سم (الزاوية القائمة تقابل الوتر)`,`نستخدم ${M("sin60° = "+F("المقابل","الوتر"))}`,`نعوض: ${M(F("√3",2)+" = "+F("20√3","x"))}`,`بالضرب التبادلي: ${M("x = "+F(2,1)+" × 20 = 40")}`],f:`x = 40 سم`,y:"نحدد الضلع المقابل والوتر من موضع الزاوية، فنعرف النسبة المناسبة (جا).",m:"استخدام cos أو tan بدل sin."},
{t:5,n:"م1 س8",q:`المستقيم الذي يصنع زاوية 45° مع الاتجاه الموجب لمحور x يوازي المستقيم ${M("kx + 2y = 5")}، فما قيمة k؟`,o:["−2","−1/2","2","1/2"],a:0,h:"المستقيمان المتوازيان ميلاهما متساويان.",
s:[`ميل المستقيم الذي يصنع زاوية 45° مع المحور x: ${M("tan45° = 1")}`,`نعزل y في المعادلة الثانية: ${M("y = "+F("−k",2)+"x + "+F(5,2))} فيكون ميلها ${M("m = "+F("−k",2))}`,`الميلان متساويان (التوازي): ${M(F("−k",2)+" = 1 ⟹ k = −2")}`],f:`(أ) k = −2`,y:"التوازي معناه نفس الميل، فنكتب المعادلة بصورة y = mx + c لنقرأ الميل.",m:"اعتبار الميل = k بدل −k/2."},
{t:5,n:"م2 س3",q:`أوجد معادلة المستقيم المار بالنقطتين (2, 5) ، (3, 7).`,s:[`الميل: ${M("m = "+F("7−5","3−2")+" = 2")}`,`نكتب المعادلة: ${M("y = mx + c ⟹ y = 2x + c")}`,`نعوض بالنقطة (2, 5): ${M("5 = 2×2 + c ⟹ c = 1")}`,`التحقق بالنقطة (3, 7): ${M("2×3 + 1 = 7 ✓")}`],f:`معادلة المستقيم: y = 2x + 1`,y:"الميل يحدد الاتجاه، ونقطة واحدة تكفي لإيجاد c، والنقطة الثانية للتأكد.",m:"عكس ترتيب الطرح في بسط أو مقام الميل."},
{t:6,n:"م1 س9",q:`في مخطط الساق والأوراق (الساق 1: 3 6 6 7 | الساق 2: 0 0 1 2 5 5 5 6 8 | الساق 3: 1 2، المفتاح 2|8 تعني 28): ما قيمة المدى؟`,o:["13","19","23.5","32"],a:1,h:"المدى = أكبر قيمة − أصغر قيمة.",
s:[`المدى = أكبر قيمة − أصغر قيمة`,`أكبر قيمة: الساق 3 والورقة 2 ← 32 ، وأصغر قيمة: الساق 1 والورقة 3 ← 13`,`المدى = ${M("32 − 13 = 19")}`],f:`(ب) 19`,y:"المدى يقيس مدى انتشار البيانات، وبنقراها من الساق (العشرات) والورقة (الآحاد).",m:"قراءة الورقة وحدها (2 − 3) دون الساق."},
{t:6,n:"م2 س6",q:`أوجد الانحراف المعياري للقيم: 3, 5, 7, 9, 11.`,s:[`الوسط الحسابي: ${M("x̄ = "+F("3+5+7+9+11",5)+" = "+F(35,5)+" = 7")}`,`ننظم الجدول: (x−7) = −4, −2, 0, 2, 4 ، و (x−7)² = 16, 4, 0, 4, 16 ومجموعها 40`,`الانحراف المعياري: ${M("σ = √"+F(40,5)+" = √8 = 2√2")}`],f:`σ = 2√2`,y:"نحسب بُعد كل قيمة عن الوسط، نربّعه لإلغاء الإشارات، نأخذ المتوسط ثم الجذر.",m:"نسيان الجذر في الآخر."},
{t:7,n:"م2 س2",q:`إذا كان مجال الدالة ${M("f(x) = "+F("x+6","x²−ax+36"))} هو ℝ − {6} فما قيمة الثابت a؟`,s:[`مجال الدالة هو ℝ − {6} أي أن العدد 6 يجعل المقام صفرًا`,`نعوض x = 6 في المقام: ${M("6² − a×6 + 36 = 0")}`,`نبسط: ${M("72 − 6a = 0 ⟹ a = 12")}`],f:`a = 12`,y:"المجال = كل الأعداد ما عدا أصفار المقام، فنساوي المقام بصفر عند العدد المستبعد.",m:"تعويض x = 6 في البسط."},
{t:7,n:"م2 س4",q:`أوجد f(x) في أبسط صورة موضحًا مجال f حيث ${M("f(x) = "+F("x²−4","x²−x−2")+" ÷ "+F("x²+5x+6","x²+2x−3"))}`,s:[`نحلل كل كثيرة حدود: ${M("x²−4 = (x−2)(x+2) ، x²−x−2 = (x−2)(x+1)")}`,`وكذلك: ${M("x²+5x+6 = (x+2)(x+3) ، x²+2x−3 = (x+3)(x−1)")}`,`المجال: نستبعد أصفار المقامين وأصفار الكسر المقسوم عليه: {−3, −2, −1, 1, 2} إذن المجال ℝ − {−3, −2, −1, 1, 2}`,`نحول القسمة إلى ضرب في المقلوب ونختصر العوامل المشتركة: ${M(F("(x−2)(x+2)","(x−2)(x+1)")+" × "+F("(x+3)(x−1)","(x+2)(x+3)"))}`],f:`${M("f(x) = "+F("x−1","x+1"))} ، المجال = ℝ − {−3, −2, −1, 1, 2}`,y:"نحدد المجال من الصورة الأصلية قبل الاختصار، لأن الاختصار يخفي القيم الممنوعة.",m:"أخذ المجال من الناتج المبسط (ℝ − {−1}) فقط."}
];
